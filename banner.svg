<svg viewBox="0 0 860 220" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f9a8d4"/>
      <stop offset="38%"  stop-color="#c084fc"/>
      <stop offset="70%"  stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <conicGradient id="orb" gradientTransform="rotate(180)">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="20%"  stop-color="#e0d4ff"/>
      <stop offset="40%"  stop-color="#c084fc"/>
      <stop offset="60%"  stop-color="#818cf8"/>
      <stop offset="80%"  stop-color="#f9a8d4"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </conicGradient>
    <radialGradient id="orbg" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#f0e8ff"/>
      <stop offset="40%"  stop-color="#c084fc"/>
      <stop offset="70%"  stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f9a8d4"/>
    </radialGradient>
    <clipPath id="rounded">
      <rect width="860" height="220" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="860" height="220" fill="url(#bg)"/>
    <circle cx="810" cy="-30" r="160" fill="rgba(255,255,255,0.1)"/>
    <circle cx="680" cy="290" r="140" fill="rgba(255,255,255,0.06)"/>
    <line x1="455" y1="22" x2="455" y2="198" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

    <text x="44" y="58" font-family="'Courier New', monospace" font-size="11" letter-spacing="2.5" fill="rgba(10,5,30,0.5)" text-anchor="start">GITHUB / YOURUSERNAME</text>

    <text x="44" y="106" font-size="42" font-weight="800" fill="#0f0820" letter-spacing="-0.5">Make the jump</text>
    <text x="44" y="150" font-size="42" font-weight="800" fill="rgba(15,8,32,0.4)" letter-spacing="-0.5">to great software.</text>

    <text x="44" y="175" font-size="13.5" fill="rgba(10,5,30,0.6)">Send pull requests, ship features, break nothing in prod.</text>
    <text x="44" y="194" font-size="13.5" fill="rgba(10,5,30,0.6)">All the things you'd expect from your favorite engineer.</text>

    <circle cx="738" cy="110" r="70" fill="url(#orbg)" opacity="0.95"/>
    <circle cx="738" cy="110" r="62" fill="rgba(255,255,255,0.18)"/>
    <text x="738" y="118" font-family="'Courier New', monospace" font-size="22" font-weight="600" fill="#0f0820" text-anchor="middle">{ }</text>
  </g>
</svg>
